# Publishes the game to GitHub Pages on every push to main,
# stamping it with a version number and the commit's date and time.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, only the newest version gets deployed
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code (with full history, to count commits)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build the site with version info
        run: |
          VERSION="v$(git rev-list --count HEAD)"
          DATE="$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M')"
          SHA="$(git rev-parse --short HEAD)"
          echo "Deploying $VERSION ($SHA) from $DATE"

          rsync -a --exclude='.*' --exclude='site' ./ site/
          sed -i "s/?v=dev/?v=$SHA/g; s|<small id=\"version\">dev</small>|<small id=\"version\">$VERSION · $DATE</small>|" site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
