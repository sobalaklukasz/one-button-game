<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Auuuuu</title>

  <!-- Lets phones run the game full screen (no browser bars) when added to the home screen -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Auuuuu">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- The "dev" version below is replaced with the commit id when deploying, so browsers never use an old saved copy -->
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <header id="header">
    <h1>Auuuuu</h1>
    <!-- Filled in automatically when deploying (see .github/workflows/deploy.yml) -->
    <small id="version">dev</small>
    <div id="score">Points: 0</div>
  </header>

  <!-- Best score ever for the current difficulty, shared by all players -->
  <div id="record"><span id="record-label">Normal record</span><span id="record-value">–</span></div>

  <canvas id="game"></canvas>

  <!-- Restart and difficulty (choosing a difficulty also restarts) -->
  <div id="controls">
    <button id="restart">↻ Restart</button>
    <div id="difficulty">
      <button data-level="easy">Easy</button>
      <button data-level="normal">Normal</button>
      <button data-level="hard">Hard</button>
    </div>
  </div>

  <!-- On-screen joystick, only shown on touch screens -->
  <div id="joystick"><div id="knob"></div></div>

  <script src="game.js?v=dev"></script>
</body>
</html>
