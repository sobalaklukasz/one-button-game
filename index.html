<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Button Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1 id="message">Press the button to win</h1>
    <button id="win-button" type="button">PRESS ME</button>
    <button id="reset-button" type="button" hidden>Play again</button>
    <p class="stats">Wins: <span id="wins">0</span></p>
  </main>

  <script src="game.js"></script>
</body>
</html>
